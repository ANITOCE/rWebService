[package]
name = "rWebService"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "rWebService"

[dependencies]
actix-web = "4"
actix-web-flash-messages = { version = "0.5", features = ["cookies"] }
actix-session = { version = "0.10", features = ["redis-session-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4.7"
serde_json = "1"
config = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1.12"
validator = { version = "0.20", features = ["derive"] }
# rand = { version = "0.10", features = ["std_rng"] }
rand = { version = "0.8.6", features = ["std_rng"] }

base64 = "0.22.1"
# argon2 is safer than sha3 that OWASP recommends, and it's also more widely used for password hashing.
# sha3 = "0.11.0"
argon2 = { version = "0.5.3", features = ["std"] }

# Error handling
# "thiserror" for expected errors that we want to handle gracefully
# "anyhow" for unexpected errors 
thiserror = "2.0.18"
anyhow = "1.0"

# version "0.10" some functions are more defferent with "0.8"
secrecy = { version = "0.8", features = ["serde"] }

tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-actix-web = "0.7"

urlencoding = "2"
htmlescape = "0.3"
hmac = { version = "0.12", features = ["std"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
claims = "0.8"
fake = "4.4.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
wiremock = "0.6"
serde_json = "1.0"
linkify = "0.10"

# Using table-like toml syntax to avoid a super-long line!
[dependencies.sqlx]
version = "0.7"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]

[dependencies.reqwest]
version = "0.12"
default-features = false
# We need the `json` feature flag to serialize/deserialize JSON payloads
features = ["json", "rustls-tls", "cookies"]